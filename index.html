<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Сканер DataMatrix</title>
<style>
:root { --bg: #f2f4f6; --surface: #fff; --ink: #222; --muted: #5f6a74; --line: #e2e6ea; --brand: #0088cc; color-scheme: light; }
@media (prefers-color-scheme: dark) { :root { --bg: #0f151a; --surface: #172028; --ink: #eef2f5; --muted: #93a1ad; --line: #2a3640; --brand: #2ea6e6; color-scheme: dark; } }
body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: var(--bg); color: var(--ink); font: 16px/1.5 -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; padding: 16px; box-sizing: border-box; }
main { max-width: 440px; background: var(--surface); border: 1px solid var(--line); border-top: 3px solid var(--brand); border-radius: 4px; padding: 24px; }
h1 { font-size: 22px; margin: 0 0 8px; }
p { margin: 0; color: var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Сканер DataMatrix</h1>
  <p>Эта версия сканера отключена. Сотрудникам ООО «Компрессор ПК»: пользуйтесь приложением по ссылке от администратора.</p>
</main>
</body>
</html>
